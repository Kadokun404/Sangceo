name: Admin mailbox

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Aksi: delete"
        required: true
        default: "delete"
        type: choice
        options: [delete]
      email:
        description: "Alamat lengkap, mis. nama@sang.ceo"
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hapus akun mailbox
        if: inputs.action == 'delete'
        env:
          RUANG_OWNER_EMAIL: ${{ secrets.RUANG_OWNER_EMAIL }}
          RUANG_OWNER_PASS: ${{ secrets.RUANG_OWNER_PASS }}
        run: node scripts/mail-delete.mjs "${{ inputs.email }}"
      - name: Hapus file klaim dari registry
        if: inputs.action == 'delete' && success()
        run: |
          NAME="${{ inputs.email }}"
          FILE="data/emails/${NAME%%@*}.json"
          if [ -f "$FILE" ]; then
            git config user.email "action@github.com"
            git config user.name "github-actions"
            git rm "$FILE"
            git commit -m "hapus klaim ${NAME}"
            git push
          else
            echo "File $FILE tidak ada, tidak ada yang dihapus dari registry."
          fi
