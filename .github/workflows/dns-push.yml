name: Push DNS

on:
  push:
    branches: [main]
    paths:
      - "data/domains/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate dnsconfig.js
        run: node scripts/gen-dnsconfig.mjs
      - name: Push zona ke Cloudflare
        uses: is-cool-me/dnscontrol-action@v4.15.0
        with:
          args: push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
